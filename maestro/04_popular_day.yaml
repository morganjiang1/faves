appId: host.exp.Exponent
env:
  APP_URL: exp://127.0.0.1:8081
---
- runFlow: 01_onboarding.yaml
- scrollUntilVisible:
    element:
      id: "more-days"
    direction: DOWN
- tapOn:
    id: "more-days"
- tapOn:
    id: "post-0-open"
- assertVisible: "Saturday in SF"
- assertVisible: "Arsicault Bakery"
- tapOn:
    id: "day-do"
- extendedWaitUntil:
    visible:
      id: "itinerary"
    timeout: 15000
- tapOn:
    id: "plan-menu"
- tapOn:
    id: "menu-recap"
- extendedWaitUntil:
    visible:
      id: "recap-screen"
    timeout: 15000
